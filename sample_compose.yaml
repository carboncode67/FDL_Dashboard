# Sample docker-compose.yml for local dev — copy this file, don't edit it in place:
#   cp sample_compose.yaml docker-compose.yml
# Then set a real POSTGRES_PASSWORD (below or via a .env file in this directory;
# docker compose reads .env automatically). docker-compose.yml is gitignored —
# your real password never gets committed.

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file or here}
      POSTGRES_DB: nocodb
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://nocodb:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file or here}@db:5432/nocodb
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Generate one with: openssl rand -base64 32}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      FARMER_SERVER_URL: ${FARMER_SERVER_URL:-}
      DATA_DIR: /app/upload-data
      # Optional. Base URL of the OFEDashBot webhook service. Required for the
      # WhatsApp admin "send message" feature (POST /api/whatsapp/send).
      OFEDASHBOT_URL: ${OFEDASHBOT_URL:-}
      # Optional. SMTP credentials for outgoing email — scheduled activity
      # reports and the "Send Onboarding Email" button (Contacts/Lab Members).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # Optional. GeoDaRT spatial-context pulls ("Pull spatial context" on farm
      # pages). Works keyless for POLARIS / USGS 3DEP / US Drought Monitor;
      # GEODART_PASSWORD_HASH (once GeoDaRT issues it) unlocks SOLUS + Sentinel-2.
      GEODART_URL: ${GEODART_URL:-https://geodart-api.farmersdatalab.scienceversa.com}
      GEODART_USER_GUID: ${GEODART_USER_GUID:-}
      GEODART_USER_EMAIL: ${GEODART_USER_EMAIL:-}
      GEODART_PASSWORD_HASH: ${GEODART_PASSWORD_HASH:-}
    volumes:
      - upload-data:/app/upload-data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  upload-data:
  db-data:
