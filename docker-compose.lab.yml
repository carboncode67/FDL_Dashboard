services:
  db:
    image: pgvector/pgvector:pg18
    restart: always
    env_file: .env.lab
    ports:
      - "127.0.0.1:5433:5432"   # localhost-only management port (5432 taken by native postgres)
    volumes:
      - db-data:/var/lib/postgresql   # postgres:18 needs the parent dir; creates 18/data/ inside
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/carboncode67/fdl-server:truenas-dev
    user: "1000:1000"
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Confirmed 2026-09-17 via `docker inspect` on the running container —
      # this file had drifted from what's actually deployed (previously read
      # /mnt/tank/backups/fdl_dashboard, the *lab server's* path, copy-pasted
      # from the production compose rather than reflecting this box's own
      # storage layout). Verify the basemap-intake mount below the same way
      # before trusting it; it wasn't re-checked this pass.
      - /mnt/Lap/Custom_Apps/FarmersDataHub/FDB/upload-data:/app/upload-data
      # Optional — only present on TrueNAS dev as of 2026-09-15, not the lab
      # server. Basemap sideload intake share (see BASEMAP_INTAKE_DIR in
      # sample_compose.yaml and docs/raster-tiling-plan.md); read-only, the
      # app only ever reads + symlinks from here.
      - /mnt/Inground/Pictures/Drone_Photos/Orthos:/app/basemap-intake:ro
    env_file: .env.lab
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  db-data:
